# kidbox website list
#
# Installed to /etc/kidbox/sites.conf. Two kinds of lines:
#
#   SITE|Menu Name|URL|domain,domain,...   menu item + allowed
#   ALLOW|domain,domain,...                allowed, but no menu item
#
# Everything else (blank lines, # comments) is ignored.
#
# A domain with no leading dot also matches its subdomains, so "ixl.com"
# covers "www.ixl.com". A leading dot ("ixl.com" -> ".ixl.com") restricts
# the match to that exact host.
#
# menu.sh reads this file every time the menu is drawn, so adding or removing
# a SITE line takes effect immediately. The browser allowlist is generated
# from this file, so after editing run:
#
#   sudo kidbox-gen-policy.py
#
# ---------------------------------------------------------------------------
# Menu items
# ---------------------------------------------------------------------------

SITE|IXL (School Practice)|https://www.ixl.com/signin|ixl.com

# Ready to use -- uncomment to put on the menu. Their domains are already
# allowed below, so no policy change is needed.
#
#SITE|Starfall (Reading)|https://www.starfall.com/|starfall.com
#SITE|ABCya (Games)|https://www.abcya.com/|abcya.com
#SITE|Typing Practice|https://www.typingclub.com/|typingclub.com
#SITE|Scratch (Programming)|https://scratch.mit.edu/|scratch.mit.edu
#SITE|Math Is Fun|https://www.mathsisfun.com/|mathsisfun.com

# ---------------------------------------------------------------------------
# Allowed but not on the menu
#
# Kid-education sites, pre-approved so that promoting one to a SITE line is a
# one-line edit. Nothing here is reachable without a menu item to start from,
# since there is no address bar.
# ---------------------------------------------------------------------------

ALLOW|starfall.com,abcya.com,mathsisfun.com,funbrain.com
ALLOW|typingclub.com,typing.com
ALLOW|scratch.mit.edu,code.org
ALLOW|ducksters.com,nasa.gov

# Deliberately NOT allowed, for the record:
#   youtube.com, pbskids.org, khanacademy.org  -- video-first
#   google.com, bing.com, duckduckgo.com       -- search reaches everything
#   simple.wikipedia.org                       -- good reading, unbounded topics

# ---------------------------------------------------------------------------
# Asset hosts
#
# Sites pull fonts, images and scripts from CDNs on other domains. If Chromium
# turns out to apply URLBlocklist to subresources and not just navigation,
# pages will render broken without these.
#
# The tradeoff: a shared CDN like cloudfront.net can serve anything, so these
# lines widen what is technically reachable. They are only reachable by typing
# a URL, and there is no address bar to type one into.
#
# Delete this block for a tighter boundary and more broken pages.
# ---------------------------------------------------------------------------

ALLOW|fonts.googleapis.com,fonts.gstatic.com,gstatic.com,googleapis.com
ALLOW|cloudflare.com,cloudflareinsights.com,jsdelivr.net,unpkg.com
ALLOW|cloudfront.net,akamaihd.net,akamaized.net,amazonaws.com
