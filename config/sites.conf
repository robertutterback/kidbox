# kidbox website list
#
# Installed to /etc/kidbox/sites.conf. Two kinds of lines:
#
#   SITE|Menu Name|URL|domain,domain,...   menu item + allowed
#   ALLOW|domain,domain,...                allowed, but no menu item
#
# Everything else (blank lines, # comments) is ignored.
#
# A domain with no leading dot also matches its subdomains, so "ixl.com"
# covers "www.ixl.com". A leading dot ("ixl.com" -> ".ixl.com") restricts
# the match to that exact host.
#
# An entry may also carry a path prefix -- "www.google.com/recaptcha" allows
# that path and leaves the rest of www.google.com blocked. The longest
# matching path prefix wins, and an allow entry beats the deny-all. No
# wildcards inside a path.
#
# This repo copy is the source of truth. install.sh copies it over
# /etc/kidbox/sites.conf and regenerates the browser policy, so the workflow
# is: edit here, then run "sudo ./install.sh" on the Pi. Editing the installed
# copy directly works until the next install silently overwrites it.
#
# ---------------------------------------------------------------------------
# Menu items
# ---------------------------------------------------------------------------

SITE|IXL (School Practice)|https://www.ixl.com/signin|ixl.com

# Ready to use -- uncomment to put on the menu. Their domains are already
# allowed below, so no policy change is needed.
#
#SITE|Starfall (Reading)|https://www.starfall.com/|starfall.com
#SITE|ABCya (Games)|https://www.abcya.com/|abcya.com
#SITE|Typing Practice|https://www.typingclub.com/|typingclub.com
#SITE|Scratch (Programming)|https://scratch.mit.edu/|scratch.mit.edu
#SITE|Math Is Fun|https://www.mathsisfun.com/|mathsisfun.com

# ---------------------------------------------------------------------------
# Allowed but not on the menu
#
# Kid-education sites, pre-approved so that promoting one to a SITE line is a
# one-line edit. Nothing here is reachable without a menu item to start from,
# since there is no address bar.
# ---------------------------------------------------------------------------

ALLOW|starfall.com,abcya.com,mathsisfun.com,funbrain.com
ALLOW|typingclub.com,typing.com
ALLOW|scratch.mit.edu,code.org
ALLOW|ducksters.com,nasa.gov

# Deliberately NOT allowed, for the record:
#   youtube.com, pbskids.org, khanacademy.org  -- video-first
#   google.com, bing.com, duckduckgo.com       -- search reaches everything
#   simple.wikipedia.org                       -- good reading, unbounded topics

# ---------------------------------------------------------------------------
# Asset hosts
#
# Sites pull fonts, images and scripts from CDNs on other domains, so pages
# render broken without these.
#
# Observed on the Pi 2026-09-06: a blocked captcha iframe on the IXL sign-in
# page drew a visible "Captcha was blocked" strip, so URLBlocklist does filter
# subframe loads, not just top-level navigation. Whether it also filters plain
# script and image subresources is still untested.
#
# The tradeoff: a shared CDN like cloudfront.net can serve anything, so these
# lines widen what is technically reachable. They are only reachable by typing
# a URL, and there is no address bar to type one into.
#
# Delete this block for a tighter boundary and more broken pages.
# ---------------------------------------------------------------------------

ALLOW|fonts.googleapis.com,fonts.gstatic.com,gstatic.com,googleapis.com
ALLOW|cloudflare.com,cloudflareinsights.com,jsdelivr.net,unpkg.com
ALLOW|cloudfront.net,akamaihd.net,akamaized.net,amazonaws.com

# ---------------------------------------------------------------------------
# Captcha and bot-check hosts
#
# Sign-in pages score visitors for bot-ness using a widget served from the
# captcha vendor's own domain. Blocked, the widget's iframe fails to load.
#
# On IXL that is cosmetic -- the score check is invisible and non-blocking, so
# sign-in and a full lesson still work, with a "Captcha was blocked" strip left
# at the bottom of the page. A site that gates sign-in on a visible challenge
# would instead be stuck on something unsolvable, which reads as "the site is
# broken" rather than "you are blocked". These lines cover both cases.
#
# We cannot tell from here which vendor a given site uses, and sites switch,
# so the common ones are all listed. These are single-purpose challenge hosts:
# unlike the CDNs above, none of them serves browsable content, so allowing
# them widens the boundary much less than the asset block does.
#
# reCAPTCHA is the exception worth reading. It is served from www.google.com,
# which is deliberately blocked above because search reaches everything. The
# path prefix is what makes both true at once: /recaptcha is allowed, /search
# is not. Do not shorten these two lines to "google.com".
# ---------------------------------------------------------------------------

ALLOW|www.google.com/recaptcha,recaptcha.google.com/recaptcha
ALLOW|recaptcha.net,apis.google.com
ALLOW|hcaptcha.com
ALLOW|arkoselabs.com,funcaptcha.com
ALLOW|captcha-delivery.com,datadome.co
ALLOW|px-cloud.net,perimeterx.net
ALLOW|geetest.com,captcha.awswaf.com
ALLOW|incapsula.com,imperva.com

# Already covered by lines further up, listed here so nobody re-adds them:
#   challenges.cloudflare.com (Turnstile)  -- covered by cloudflare.com
#   www.gstatic.com/recaptcha (assets)     -- covered by gstatic.com
