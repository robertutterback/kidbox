# DOSBox settings for kidbox games, used by bin/dos.sh. Only the settings
# that differ from DOSBox 0.74's defaults are here; everything else is the
# default. Which game to run comes from dos.sh, not from [autoexec].

[sdl]
# Fill the screen. Seen on the Pi with a time-limited game (Oregon Trail):
# the screen-time bar shows at first, through the game's main menu, and is
# covered once play starts (the session still ends at zero). The cause is
# not confirmed; DOSBox may put a new fullscreen window over the bar when
# the game changes video mode. Running in a window avoids it, so a limited
# game should get its own dosbox-<folder>.conf with fullscreen=false and a
# windowresolution, as dosbox-oregon-trail.conf does; dos.sh centres it.
fullscreen=true
fullresolution=desktop
# Scales the game up to the screen. "surface" (the default) does not scale,
# which leaves a small picture in the middle. Try "overlay" if this is slow.
output=opengl
# Keep the mouse inside the game window (Storybook Weaver uses one).
autolock=true
waitonerror=false

[render]
# Keep 4:3 on a wide screen rather than stretching.
aspect=true

[dos]
keyboardlayout=auto
