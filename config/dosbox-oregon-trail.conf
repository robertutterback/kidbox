# Oregon Trail only: read by bin/dos.sh after dosbox.conf, overriding it.
#
# The trail map (640x400, unlike the game's other 320x200 screens) looks
# drawn for square pixels: dosbox.conf's 4:3 correction, right for the rest
# of the game, makes it tall and skinny. With no correction the map is
# right, but filled to the screen everything was too big and chunky, so it
# runs in a fixed window instead, which dos.sh centres.
#
# opengl scales every screen to fill the window. "surface" with a scaler
# kept the picture small but left the previous screen showing around the
# map, which is a different size.

[sdl]
fullscreen=false
windowresolution=1440x900
output=opengl

[render]
aspect=false
